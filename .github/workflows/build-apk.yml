name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk VegasEnPareja.apk

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VegasEnPareja-apk
          path: VegasEnPareja.apk

      - name: Publicar en Releases (descarga directa desde la tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Vegas en Pareja v1.0.${{ github.run_number }}
          body: Descarga **VegasEnPareja.apk** desde la tablet o el celular e instálalo.
          files: VegasEnPareja.apk
          make_latest: true
